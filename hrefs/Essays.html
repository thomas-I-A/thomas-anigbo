        /* Base notification styles */
.notification-banner {
  border-radius: 6%;
  position: fixed;
  left: 344px;
  width: 20%;
  height: 30%;
  background-color: #ae3535; /* Royal Blue background */
  color: #ffffff;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  z-index: 9999; /* Ensures it stays on top of all elements */
  font-family: sans-serif;
  transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
}

/* Internal layout */
.notification-content {
  display: flex;
  align-items: center;
  gap: 10px;
}

.notification-text {
  margin: 0;
  font-size: 14px;
  color: black;
}

/* Close button styling */
.close-btn {
  background: none;
  border: none;
  color: #ffffff;
  font-size: 24px;
  cursor: pointer;
  opacity: 0.8;
  line-height: 1;
}

.close-btn:hover {
  opacity: 1;
}

/* Class to hide the notification smoothly */
.notification-banner.hidden {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
